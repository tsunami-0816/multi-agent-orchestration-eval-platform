# 多智能体编排与模型评测一体化平台
# 依赖管理：使用 requirements.txt（本文件仅保留工具配置）
# 安装依赖：pip install -r requirements.txt
# 安装开发依赖：pip install pytest pytest-asyncio pytest-cov ruff mypy httpx

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-orchestration-eval-platform"
version = "0.1.0"
description = "多智能体编排与模型评测一体化平台"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
